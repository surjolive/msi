<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Game Screen Background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1280" height="720" fill="url(#skyGradient)"/>
  
  <!-- Game Map Area -->
  <rect x="50" y="50" width="1180" height="550" fill="#90EE90" opacity="0.3" stroke="#228B22" stroke-width="2"/>
  <text x="640" y="350" font-size="48" font-weight="bold" fill="#000000" text-anchor="middle" font-family="Arial">
    Free Fire Game Area
  </text>
  
  <!-- Left Control Panel (Movement) -->
  <g id="leftControls">
    <!-- Background -->
    <rect x="20" y="600" width="200" height="100" fill="#000000" opacity="0.7" rx="8"/>
    
    <!-- D-Pad Style Controls -->
    <circle cx="60" cy="630" r="8" fill="#ff6b6b" stroke="#ffffff" stroke-width="1"/>
    <text x="60" y="655" font-size="12" fill="#ffffff" text-anchor="middle" font-family="Arial">W</text>
    
    <circle cx="40" cy="650" r="8" fill="#ff6b6b" stroke="#ffffff" stroke-width="1"/>
    <text x="40" y="675" font-size="12" fill="#ffffff" text-anchor="middle" font-family="Arial">A</text>
    
    <circle cx="80" cy="650" r="8" fill="#ff6b6b" stroke="#ffffff" stroke-width="1"/>
    <text x="80" y="675" font-size="12" fill="#ffffff" text-anchor="middle" font-family="Arial">D</text>
    
    <circle cx="60" cy="670" r="8" fill="#ff6b6b" stroke="#ffffff" stroke-width="1"/>
    <text x="60" y="695" font-size="12" fill="#ffffff" text-anchor="middle" font-family="Arial">S</text>
    
    <!-- Action Buttons -->
    <rect x="120" y="620" width="80" height="60" fill="#4CAF50" rx="4" stroke="#ffffff" stroke-width="2"/>
    <text x="160" y="655" font-size="14" fill="#ffffff" text-anchor="middle" font-family="Arial" font-weight="bold">
      Actions
    </text>
  </g>
  
  <!-- Right Control Panel (Combat) -->
  <g id="rightControls">
    <!-- Background -->
    <rect x="1060" y="600" width="200" height="100" fill="#000000" opacity="0.7" rx="8"/>
    
    <!-- Fire Button -->
    <circle cx="1100" cy="630" r="20" fill="#ff0000" stroke="#ffffff" stroke-width="2"/>
    <text x="1100" y="640" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Arial" font-weight="bold">
      FIRE
    </text>
    
    <!-- Aim Area -->
    <rect x="1140" y="620" width="100" height="80" fill="#2196F3" rx="4" stroke="#ffffff" stroke-width="2"/>
    <text x="1190" y="650" font-size="12" fill="#ffffff" text-anchor="middle" font-family="Arial">
      AIM
    </text>
    <text x="1190" y="670" font-size="11" fill="#cccccc" text-anchor="middle" font-family="Arial">
      (Mouse/Right Stick)
    </text>
  </g>
  
  <!-- Center Crosshair -->
  <g id="crosshair">
    <line x1="640" y1="330" x2="640" y2="370" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="610" y1="350" x2="670" y2="350" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <circle cx="640" cy="350" r="12" fill="none" stroke="#ff0000" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Status Info -->
  <rect x="20" y="20" width="300" height="80" fill="#000000" opacity="0.6" rx="4"/>
  <text x="40" y="45" font-size="14" fill="#00ff00" font-family="Arial" font-weight="bold">
    Player: 100 HP
  </text>
  <text x="40" y="70" font-size="12" fill="#ffff00" font-family="Arial">
    Ammo: 120 | Weapon: AR
  </text>
  <text x="40" y="90" font-size="12" fill="#ff9999" font-family="Arial">
    Location: Downtown
  </text>
  
  <!-- Mini Map -->
  <rect x="940" y="20" width="320" height="240" fill="#000000" opacity="0.7" stroke="#ffff00" stroke-width="2" rx="4"/>
  <text x="1100" y="40" font-size="14" fill="#ffff00" text-anchor="middle" font-family="Arial" font-weight="bold">
    MINI MAP
  </text>
  
  <!-- Player Marker on Map -->
  <circle cx="1100" cy="120" r="6" fill="#00ff00" stroke="#ffffff" stroke-width="1"/>
  <text x="1100" y="250" font-size="12" fill="#cccccc" text-anchor="middle" font-family="Arial">
    Controls: WASD + Mouse / Gamepad
  </text>
  
  <!-- Title -->
  <text x="640" y="30" font-size="20" fill="#ffffff" text-anchor="middle" font-family="Arial" font-weight="bold">
    Free Fire - Control Overlay Demo
  </text>
</svg>
