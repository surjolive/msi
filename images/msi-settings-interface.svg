<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="600" y="60" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">
    Settings
  </text>
  
  <!-- Left Menu Panel -->
  <rect x="30" y="100" width="300" height="650" fill="#2a2a3e" rx="8"/>
  <text x="50" y="140" font-size="18" fill="#ffffff" font-family="Arial" font-weight="bold">Menu Options</text>
  
  <!-- Menu Items -->
  <text x="50" y="180" font-size="16" fill="#cccccc" font-family="Arial">• Performance</text>
  <text x="50" y="215" font-size="16" fill="#cccccc" font-family="Arial">• Display</text>
  <text x="50" y="250" font-size="16" fill="#cccccc" font-family="Arial">• Graphics</text>
  <text x="50" y="285" font-size="16" fill="#cccccc" font-family="Arial">• Game settings</text>
  <text x="50" y="320" font-size="16" fill="#cccccc" font-family="Arial">• Devices</text>
  <text x="50" y="355" font-size="16" fill="#cccccc" font-family="Arial">• Gamepad</text>
  <text x="50" y="390" font-size="16" fill="#cccccc" font-family="Arial">• Preferences</text>
  <text x="50" y="425" font-size="16" fill="#cccccc" font-family="Arial">• Phone</text>
  <text x="50" y="460" font-size="16" fill="#cccccc" font-family="Arial">• Shortcuts</text>
  <text x="50" y="495" font-size="16" fill="#cccccc" font-family="Arial">• User data</text>
  <text x="50" y="530" font-size="16" fill="#cccccc" font-family="Arial">• Advanced</text>
  <text x="50" y="565" font-size="16" fill="#ff6b6b" font-family="Arial">• About</text>
  
  <!-- Right Content Panel -->
  <rect x="370" y="100" width="800" height="650" fill="#2a2a3e" rx="8"/>
  
  <!-- Logo Box -->
  <rect x="400" y="150" width="250" height="280" fill="#1a1a2e" rx="8" stroke="#ff9f43" stroke-width="3"/>
  
  <!-- Colorful Logo Circle -->
  <circle cx="525" cy="220" r="60" fill="none" stroke="#ffeb3b" stroke-width="8"/>
  <path d="M 520 200 L 530 200 L 530 240 L 520 240 Z" fill="#ffffff"/>
  <path d="M 500 220 L 520 215 L 520 225 Z" fill="#ffffff"/>
  <path d="M 530 220 L 550 215 L 550 225 Z" fill="#ffffff"/>
  <path d="M 525 240 L 525 260" stroke="#ffffff" stroke-width="2"/>
  
  <!-- MSI Text -->
  <text x="525" y="330" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial">MSI</text>
  <text x="525" y="360" font-size="14" fill="#cccccc" text-anchor="middle" font-family="Arial">App Player</text>
  <text x="525" y="380" font-size="12" fill="#999999" text-anchor="middle" font-family="Arial">5.22.167.6310 P64</text>
  
  <!-- Check for Updates Button -->
  <rect x="750" y="200" width="200" height="50" fill="none" stroke="#ff6b6b" stroke-width="2" rx="4"/>
  <text x="850" y="232" font-size="16" fill="#ff6b6b" text-anchor="middle" font-family="Arial" font-weight="bold">
    Check for updates
  </text>
  
  <!-- Version Info -->
  <rect x="400" y="460" width="750" height="120" fill="#1a1a2e" rx="4" stroke="#444444" stroke-width="1"/>
  <text x="420" y="490" font-size="14" font-weight="bold" fill="#ffffff" font-family="Arial">System Information</text>
  <text x="420" y="520" font-size="12" fill="#cccccc" font-family="Arial">Version: 5.22.167.6310 (Native)</text>
  <text x="420" y="545" font-size="12" fill="#cccccc" font-family="Arial">Platform: 64-bit Windows</text>
  <text x="420" y="570" font-size="12" fill="#cccccc" font-family="Arial">Last Updated: 2026-08-15</text>
  
  <!-- Footer -->
  <text x="600" y="780" font-size="12" fill="#666666" text-anchor="middle" font-family="Arial">
    MSI App Player Settings Interface
  </text>
</svg>
